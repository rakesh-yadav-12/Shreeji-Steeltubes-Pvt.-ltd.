{% extends "base.html" %}{% block body %}
<div class="card login">
<img class="login-logo" src="/static/logo.png" alt="Shreeji SteelTubes Pvt. Ltd.">
<h2>Admin Login</h2>
<p class="mute sub">Sign in to manage enquiries, contacts and files</p>
<form method="post" autocomplete="on">
 <div class="field"><label for="login">Username or mobile number</label>
  <input id="login" name="login" placeholder="Enter username or mobile number" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required></div>
 <div class="field"><label for="password">Password</label>
  <div class="pwd-wrap">
   <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
   <button type="button" class="pwd-eye" onclick="const i=document.getElementById('password');const on=i.type==='password';i.type=on?'text':'password';this.textContent=on?'🙈':'👁️';this.setAttribute('aria-label',on?'Hide password':'Show password')" aria-label="Show password">👁️</button>
  </div></div>
 <button type="submit">Login →</button>
</form>
<p class="foot">Shreeji SteelTubes Pvt. Ltd. &middot; House of Quality Steel Tubes</p>
</div>
{% endblock %}
