{% extends "base.html" %}{% block body %}
<style>
#box{height:60vh;overflow-y:auto;background:#f2f4fc;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:8px 12px;border-radius:8px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 1px #0002}
.bot{background:#fff;align-self:flex-start;border:1px solid #e5e7f5}.me{background:#26399e;color:#fff;align-self:flex-end}
#f{display:flex;gap:8px;margin-top:10px}#t{flex:1;padding:12px;border:1px solid #d3d7e0;border-radius:20px}
.q button{margin:4px 4px 0 0;background:#fff;color:#26399e;border:1.5px solid #26399e;border-radius:16px}
.q button:hover{background:#26399e;color:#fff}
#f button{background:#f15307}
</style>
<div class="card"><h3>🟠 Shreeji SteelTubes Pvt. Ltd. – Chatbot</h3>
<div id="box"></div>
<div class="q"><button onclick="go('hi')">Hi</button><button onclick="go('1')">1</button><button onclick="go('2')">2</button><button onclick="go('3')">3</button><button onclick="go('menu')">Menu</button><button onclick="go('skip')">Skip</button></div>
<form id="f" onsubmit="return send()"><input id="t" placeholder="Type a message…" autocomplete="off" autofocus><button>Send</button></form></div>
<script>
const box=document.getElementById('box'),t=document.getElementById('t');
function add(cls,html){const d=document.createElement('div');d.className='m '+cls;d.innerHTML=html;box.appendChild(d);box.scrollTop=box.scrollHeight}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const fmt=s=>esc(s).replace(/\*(.+?)\*/g,'<b>$1</b>').replace(/_(.+?)_/g,'<i>$1</i>');
async function go(x){add('me',esc(x));
 const r=await fetch('/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:x})});
 const j=await r.json();
 j.replies.forEach(m=>add('bot',m.type==='text'?fmt(m.text):'📄 <a href="'+m.url+'" target="_blank">'+esc(m.name)+'</a>'+(m.caption?'<br>'+esc(m.caption):'')))}
function send(){const v=t.value.trim();if(v){t.value='';go(v)}return false}
go('hi');
</script>{% endblock %}
